# Janus configuration for the Spark deployment. Mounted at /opt/data/config.yaml.
# Secrets come from the environment (${VAR}); see README.md next to this file.

model:
  provider: anthropic
  default: claude-opus-5-5

agent:
  reasoning_effort: medium
  # No shell, no code execution: Janus reads Spark and writes words. Spark denies any approval
  # prompt that still shows up.
  disabled_toolsets:
    - terminal
    - code_execution

approvals:
  mode: manual
  gateway_timeout: 30

platforms:
  api_server:
    enabled: true
    extra:
      host: 0.0.0.0
      port: 8642
      key: ${API_SERVER_KEY}

platform_toolsets:
  api_server:
    - spark

mcp_servers:
  spark:
    url: ${SPARK_MCP_URL}
    headers:
      Authorization: "Bearer ${SPARK_MCP_TOKEN}"
    timeout: 120
    connect_timeout: 30
    tools:
      include:
        - list_brands
        - list_channels
        - list_posts
        - get_post
        - list_ideas
        - best_posting_times
        - get_analytics
      resources: false
      prompts: false

skills:
  external_dirs: []
