name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Unit and HTTP tests
        run: uv run pytest -q --ignore=tests/e2e
      - name: API schema matches the committed OpenAPI document
        run: |
          uv run python -m spark.api.openapi /tmp/openapi.json
          diff -u frontend/src/api/openapi.json /tmp/openapi.json || {
            echo "::error::frontend/src/api/openapi.json is stale. Run: uv run python -m spark.api.openapi frontend/src/api/openapi.json && (cd frontend && npm run api:types)"; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated types match the OpenAPI document
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts || { echo "::error::src/api/schema.d.ts is stale. Run: npm run api:types"; exit 1; }
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium
      - name: Browser smoke tests
        run: uv run pytest -q tests/e2e
      - name: Build Docker image
        run: docker build -t spark:ci .
