name: Update Janus

# Rebuilds the Janus service on Coolify from the latest main branch of magnetoid/Janus-Agent,
# once a week and on demand. Spark's "Update now" button calls the same webhook.
# Secrets: COOLIFY_JANUS_WEBHOOK (Coolify → janus app → Webhooks → deploy URL),
#          COOLIFY_TOKEN (Coolify → Keys & Tokens → API token).

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Coolify deploy webhook
        env:
          WEBHOOK: ${{ secrets.COOLIFY_JANUS_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "COOLIFY_JANUS_WEBHOOK is not set; nothing to do"; exit 0; fi
          code=$(curl -sS -o /tmp/out -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$WEBHOOK")
          cat /tmp/out; echo
          case "$code" in 2*) echo "Deploy queued ($code)";; *) echo "Webhook answered $code"; exit 1;; esac
