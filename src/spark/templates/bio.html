{% extends "base.html" %}
{% block title %}Bio page · Spark{% endblock %}
{% block content %}
<div class="flex flex-wrap items-end justify-between gap-4 mb-6">
  <div><h1 class="text-2xl font-semibold tracking-tight">Bio page</h1><p class="text-sm text-mute mt-1">A link-in-bio page with optional email capture. Public at <a href="{{ public_url }}" target="_blank" rel="noopener" class="text-cobalt">{{ public_url }}</a> · {{ page.views }} views</p></div>
</div>
<form method="post" class="form grid lg:grid-cols-3 gap-8" x-data='{links: {{ page.links|tojson }}}'>
  <div class="lg:col-span-2 space-y-5">
    <div class="card p-5 space-y-4">
      <div class="grid sm:grid-cols-2 gap-4">
        <div><label>Title</label><input type="text" name="title" value="{{ page.title }}"></div>
        <div><label>Theme</label><select name="theme">{% for t in ['light','dark','amber'] %}<option {% if page.theme==t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></div>
      </div>
      <div><label>Bio</label><textarea name="bio" rows="3">{{ page.bio or '' }}</textarea></div>
      <div><label>Avatar</label><select name="avatar_media_id"><option value="">None</option>{% for m in images %}<option value="{{ m.id }}" {% if page.avatar_media_id==m.id %}selected{% endif %}>{{ m.filename }}</option>{% endfor %}</select></div>
    </div>
    <div class="card p-5">
      <div class="flex items-center justify-between mb-3"><label class="!mb-0">Links</label><button type="button" class="btn btn-sm btn-ghost" @click="links.push({label:'',url:''})">Add link</button></div>
      <template x-for="(l, i) in links" :key="i">
        <div class="flex gap-2 mb-2">
          <input type="text" name="link_label" x-model="l.label" placeholder="Label" class="w-1/3">
          <input type="url" name="link_url" x-model="l.url" placeholder="https://">
          <button type="button" class="text-mute hover:text-brick px-2" @click="links.splice(i,1)" aria-label="Remove">×</button>
        </div>
      </template>
      <p class="hint" x-show="!links.length">No links yet.</p>
    </div>
  </div>
  <div class="space-y-5 self-start">
    <div class="card p-5 space-y-3">
      <label class="flex items-center gap-2 font-normal text-sm"><input type="checkbox" name="is_published" {% if page.is_published %}checked{% endif %}>Page is public</label>
      <label class="flex items-center gap-2 font-normal text-sm"><input type="checkbox" name="capture_email" {% if page.capture_email %}checked{% endif %}>Show email signup form</label>
      <div><label>Add signups to list</label><select name="capture_list_id"><option value="">No list</option>{% for l in lists %}<option value="{{ l.id }}" {% if page.capture_list_id==l.id %}selected{% endif %}>{{ l.name }}</option>{% endfor %}</select></div>
    </div>
    {% if user.can_edit() %}<button class="btn btn-amber w-full justify-center">Save bio page</button>{% endif %}
  </div>
</form>
{% endblock %}
