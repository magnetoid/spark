{% extends "base.html" %}
{% block title %}Calendar · Spark{% endblock %}
{% block content %}
<div class="flex flex-wrap items-center justify-between gap-4 mb-4">
  <div class="flex items-center gap-3">
    <a href="{{ prev_link }}" class="btn" data-variant="outline" data-size="sm" aria-label="Previous">‹</a>
    <h1 class="text-2xl font-semibold tracking-tight min-w-[12rem] text-center">{{ title }}</h1>
    <a href="{{ next_link }}" class="btn" data-variant="outline" data-size="sm" aria-label="Next">›</a>
    <a href="/calendar?view={{ view }}{% if account %}&account={{ account }}{% endif %}{% if campaign %}&campaign={{ campaign }}{% endif %}" class="text-sm text-cobalt ml-1">Today</a>
  </div>
  <form method="get" action="/calendar" class="flex flex-wrap items-center gap-2 text-sm">
    <input type="hidden" name="view" value="{{ view }}">
    <div class="tabs"><nav role="tablist" aria-orientation="horizontal" data-variant="line">
      <a role="tab" href="/calendar?view=week{% if account %}&account={{ account }}{% endif %}{% if campaign %}&campaign={{ campaign }}{% endif %}" aria-selected="{{ 'true' if view=='week' else 'false' }}" class="btn" data-variant="ghost" data-size="sm">Week</a>
      <a role="tab" href="/calendar?view=month{% if account %}&account={{ account }}{% endif %}{% if campaign %}&campaign={{ campaign }}{% endif %}" aria-selected="{{ 'true' if view=='month' else 'false' }}" class="btn" data-variant="ghost" data-size="sm">Month</a>
    </nav></div>
    <select name="account" class="select w-44" onchange="this.form.submit()">
      <option value="">All channels</option>
      {% for a in accounts %}<option value="{{ a.id }}" {% if account==a.id %}selected{% endif %}>{{ a.handle }} · {{ a.platform }}</option>{% endfor %}
    </select>
    <select name="campaign" class="select w-44" onchange="this.form.submit()">
      <option value="">All campaigns</option>
      {% for c in campaigns %}<option value="{{ c.id }}" {% if campaign==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
    </select>
  </form>
</div>
<p class="text-xs text-mute mb-3">Drag a post to another day to reschedule. Times are {{ brand.timezone }}.</p>

{% include "partials/calendar_grid.html" %}
{% endblock %}
{% block scripts %}
<script>
window.onPostSaved = () => { const g = document.getElementById("calendar-grid"); if (g) refreshRegion("#calendar-grid", g.dataset.refreshUrl); };
function cal(){ return {
  drag(e, id){ e.dataTransfer.setData('text/plain', id); },
  async drop(e, day){
    const id = e.dataTransfer.getData('text/plain'); if(!id) return;
    const body = new URLSearchParams({post_id: id, day});
    const r = await fetch('/calendar/move', {method:'POST', headers:{'HX-Request':'true'}, body});
    if (r.ok) window.onPostSaved(); else { const d = await r.json().catch(()=>({})); toast(d.detail || 'Could not move that post', 'error'); }
  }
}}
</script>
{% endblock %}
